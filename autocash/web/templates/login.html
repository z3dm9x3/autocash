{% extends "base.html" %}{% block title %}вход{% endblock %}
{% block body %}
<h2>Вход в админку Autocash</h2>
<form method="post" action="/login">
<p><label>Telegram ID<br><input name="tg_id" inputmode="numeric" required autofocus></label></p>
<p><label>Пароль<br><input name="password" type="password" required></label></p>
<button>Войти</button></form>
<p class="muted">Пароль задаётся на сервере: <code>python -m autocash.cli.webuser set &lt;Telegram ID&gt;</code>. Доступ — у ролей admin и dev.</p>
{% endblock %}
