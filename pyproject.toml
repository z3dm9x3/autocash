[project]
name = "autocash"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["accounts", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM105", "ASYNC109", "ASYNC110"]

[tool.mypy]
python_version = "3.12"
files = ["autocash", "tests"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["asyncpg.*", "re2.*", "pymorphy3.*", "telethon.*", "dotenv.*", "pyaes.*"]
ignore_missing_imports = true
