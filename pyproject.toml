[project]
name = "autocash"
version = "0.2.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Tests of a module live in its folder: autocash/modules/<name>/<PREFIX>_tests/<PREFIX>_test_*.py
testpaths = ["tests", "autocash/modules"]
python_files = ["test_*.py", "*_test_*.py"]
addopts = "-q"
# No test may hang: one test gets 5 minutes at most (the thread method works on Windows too).
# A whole run is capped from the outside: `timeout 2400 python -m pytest`.
timeout = 300
timeout_method = "thread"
# The limit applies to the test body; fixtures have their own (initdb 600 s, pg_ctl 300 s, pipeline 120 s).
timeout_func_only = true

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["accounts", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM105", "ASYNC109", "ASYNC110"]

[tool.mypy]
python_version = "3.12"
files = ["autocash", "tests"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["asyncpg.*", "re2.*", "pymorphy3.*", "telethon.*", "dotenv.*", "pyaes.*"]
ignore_missing_imports = true
