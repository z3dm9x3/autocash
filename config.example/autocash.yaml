# Autocash configuration example (FT-13.1). Copy the directory to `config/` and edit.
# A directory of *.yaml files is merged in name order; one file works as well.
# Every value marked OPEN-QUESTION is a default until section 8 of the TZ is answered
# (see docs/open_questions.md). Chat and user ids below are placeholders.

service_chats:
  logs: -1009000000001    # errors, warnings, new chats without a role
  debug: -1009000000002   # periodic summary of `unknown` messages

# Users, groups, roles and rights live in PostgreSQL (module Role Manager, tables rm_*), not here.
# The first Dev is written into rm_users once: python -m autocash.modules.role_manager.RM_cli user <TGID> dev

defaults:
  # Roles of groups and their policies: module Role Manager (tables rm_*). A group without a role
  # is "other": known to exist, not read. The policies below are for roles written in `sources`.
  policy_by_role: {channel: presence, logs: ignore, debug: ignore}

sources:
  - chat_id: -1001000000001
    name: Касса 1
    roles: [kassa]
    template: kassa
    priority: 1                      # 1 is the highest; still accepted when the buffer is full
    senders: {5001: kassa_bot, 6001: casher}
  - chat_id: -1001000000002
    name: Касса 2
    roles: [kassa]
    template: kassa
    senders: {5001: kassa_bot}
    disabled_rules: []               # ids of template rules switched off for this source
    rule_overrides: {}               # rule id -> fields of the rule to override

# Forms of features for the Extractor (FT-3.4). No meaning here: that is the sorter's job.
manifest:
  number_min_len: 4
  number_max_len: 20
  markers: ["✅", "❌", "🔴", "🟢", "🟡", "⚠️"]
  dictionaries:
    deposit: [депозит]
  subfields:
    Пользователь: {regex: '^(?P<name>\S+)\s+ID:\s*(?P<id>\d+)$'}
    Успешных депозитов: {regex: '^(?P<marker>\S+)\s+(?P<count>\d+)\s+\(всего:\s*(?P<total>\d+)\)$'}
    Метод оплаты: {regex: '^(?P<method>.*?)\s+(?P<min>\d[\d ]*\d)\s*-\s*(?P<max>\d[\d ]*\d)$'}
  commands:
    bare: [scam, unban]              # commands accepted without a leading slash (FT-12.3)

# Sorting rules grouped into templates (FT-6.1..6.3). The first matching rule wins.
# The real kassa template is the subject of stage 2 and needs recorded messages (NFT-21).
templates:
  kassa:
    rules:
      - id: deposit_request
        type: deposit.request
        when: {sender_role: [kassa_bot], header: ["ДЕПОЗИТ ТРЕУГОЛЬНИК", "ДЕПОЗИТ ПРЕДУСТАНОВЛЕННАЯ СУММА"]}
        fields: {deposit_id: "Deposit ID", mel_id: "Номер счёта", tgid: "Пользователь.id"}
        order_key: [deposit_id]
        priority: 3
        text_ttl_days: 90            # OPEN-QUESTION: FT-5.3

buffer:
  retention_hours: 72                # OPEN-QUESTION: FT-4.3
  soft_limit_mb: 512
  hard_limit_mb: 1024
  top_priority: 1

uploader:
  batch_interval_ms: 100             # A-1
  batch_max: 500

writer:
  flush_interval_ms: 20
  batch_max: 500

queue:
  maxsize: 10000
  live_threshold: 100
  backfill_rate_per_s: 50
  commit_window: 500
  warn_len: 5000
  warn_lag_s: 5.0

# Modules are listed explicitly. `demo` counts messages and answers /ping: testing only.
# `deposits` and `players` need the kassa template rules (types deposit.*, method.*): the
# template must be written from recorded kassa messages (tests/fixtures/messages/README.md).
modules:
  role_manager: {}                     # the first module: users, groups, roles, rights (RM_readme.md)
  # DRAFTS: the logic of kassa messages is not known yet, these modules are switched off.
  deposits:
    enabled: false
    config:
      binding: [reply, confirmation]   # OPEN-QUESTION: FT-З.9 - how requisites are tied to a request
      reconcile_after_min: 30          # OPEN-QUESTION: FT-З.10 - X
      stuck_after_h: 24                # OPEN-QUESTION: FT-З.11 - Y
      unknown_share_max: 0.05          # OPEN-QUESTION: stage 2 - acceptable share of unknown
  players:
    enabled: false
    config:
      merge_confirm_threshold: 6       # OPEN-QUESTION: FT-И.3 - larger joins wait for a staff decision
  reactions: {}                        # rules below; the module must be listed to run them

# Loading the history of chats (stage 4): /backfill start [days] [all | chat_id], pause, resume, status.
# Web admin (stage 5, docs/decisions.md D-5-1..6). Passwords: python -m autocash.cli.webuser set <tg_id>.
web:
  enabled: false
  host: 127.0.0.1   # not exposed: an SSH tunnel or a reverse proxy with HTTPS
  port: 8088
  session_hours: 12
  secure_cookie: false
  git_commit: true

backfill:
  days: 30                             # OPEN-QUESTION: stage 4 - how far back the history is loaded
  batch: 100                           # messages per request
  interval_s: 1.0                      # pause of a chat between requests: the live flow comes first
  chats_at_once: 4

# Reaction rules (FT-8.5): when -> if (JSONLogic) -> then (actions). Changed by /reload.
reactions:
  autoreply_pause_min: 30              # OPEN-QUESTION: FT-8.10 - no auto answer N minutes after a human one
  per_dialog_per_hour: 3               # NFT-12: limits of automatic answers
  per_account_per_hour: 30
  rules:
    - id: scam
      when: {command: scam, args: [{name: id, type: ident}]}
      then:
        - {action: call, name: resolve_player, ident: "{{ args.id }}", as: p}
        - action: if
          cond: {"==": [{var: r.p.status}, ambiguous]}
          then: [{action: ask, text: "Уточните: tg:{{ args.id }} или mel:{{ args.id }}", arg: id}]
          else:
            - {action: call, name: player_mark, kind: scam, ident: "{{ r.p.ident }}"}
            - {action: reply, text: "Страйк записан: {{ r.p.ident }}"}
    - id: example_autoreply
      enabled: false                   # an example: switch on after a dry run (mode: dry_run)
      mode: dry_run
      autoreply: true
      when: {type: [player.question]}
      then: [{action: reply, text: "Оператор скоро ответит."}]

# Pool of 1-10 accounts (FT-1.x). Accounts are the encrypted session files of this directory:
# a file appearing adds an account, a file vanishing removes it, without a restart.
pool:
  sessions_dir: /var/lib/autocash/sessions
  scan_interval_s: 2.0
  api_concurrency: 1                 # FT-10.1: 1 or 2 simultaneous API calls per account
  api_rate_per_s: {user: 1.0, bot: 10.0}   # active API calls; see docs/decisions.md, D-1b-4
  backfill_share: 0.5
  flood_slowdown: 2.0                # tempo divisor after a FloodWait
  flood_recovery_s: 600
  reconnect_s: 2.0
  rebalance_s: 5.0                   # OPEN-QUESTION: FT-1.7

coverage:
  required_by_role: {kassa: 2}       # OPEN-QUESTION: FT-1.5
  default: 1

poll:
  chats_per_account: 10              # FT-2.5
  silence_norm_s: 600
  difference_limit: 100
  idle_interval_s: 30

output:
  # Send tempo by account kind (FT-9.7). Bots: Telegram's published guidance.
  # User accounts: nothing is published, the values are conservative (D-1b-4).
  pacing:
    bot: {per_chat_interval_s: 1.0, per_account_interval_s: 0.04, group_per_minute: 20}
    user: {per_chat_interval_s: 3.0, per_account_interval_s: 3.0, group_per_minute: 10}
  max_attempts: 5
  ttl_s: {command_reply: 300, client_reply: 1800, notify: 3600, bulk: 86400}   # OPEN-QUESTION: FT-9.6

retention:
  default_text_ttl_days: 90          # OPEN-QUESTION: FT-5.3
  trace_days: 30                     # OPEN-QUESTION: FT-11.11

sorter:
  unknown_summary_interval_s: 3600

# OPEN-QUESTION: FT-11.7 - how long a task may wait for the next stage, seconds; over it the
# task is marked "stuck" and listed by /stuck (stage names: autocash/core/trace/monitor.py)
stage_norms_s: {in_pg: 2, sorted: 2, module_done: 30, out_assigned: 60, out_sending: 60, out_delivered: 30}

trace:
  stuck_check_s: 5
  mass_stuck_threshold: 20           # OPEN-QUESTION: FT-11.7 - stuck tasks on one stage that raise an alarm
  rollup_interval_s: 60              # hourly stage metrics are recomputed this often
  purge_interval_s: 3600             # detailed traces older than retention.trace_days are removed

# Rights to commands: module Role Manager (table rm_permissions). For now only Admin runs commands;
# Dev runs every command always. A command without rights is not answered: the refusal goes to `logs`.

commands:
  heavy: [metrics]                   # FT-12.6: confirmed at once, the result comes when ready

reports:
  statement_timeout_ms: 1000         # NFT-15: own connections for reports and read commands
  pool_size: 2

report_timezone: Europe/Moscow       # NFT-19: day boundary for reports; stored timestamps are UTC
